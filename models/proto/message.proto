syntax = "proto3";

package libre_message;

message Envelope {
  Message message = 1;
}

message Message {
  bytes id = 1;

  bytes sender_id = 2;

  bytes recipient_id = 3;

  uint64 timestamp = 4;

  oneof content {
    TextMessage text = 5;
    Handshake handshake = 6;
  }
}

message TextMessage {
  string text = 1;
}

message Handshake {
  bytes sender_id = 1;
}
